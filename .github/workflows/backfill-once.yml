name: Backfill (one-off, manual)

# Ручной one-off бэкфилл для 17-го Передового Полка ("Курс молодого бойца",
# см. CLAUDE.md / раздел "Recruit pipeline"). Миграция 0076 добавила только
# колонку is_recruit_promotion, саму строку категории завести нужно отдельно
# по конвенции проекта (бэкфиллы — не в миграциях). Идемпотентно (WHERE NOT
# EXISTS) — безопасно перезапускать. Запускать вручную через
# workflow_dispatch, удалить файл после успешного запуска.
on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: self-hosted
    steps:
      - name: Insert "Курс молодого бойца" category for 17th Regiment
        run: |
          set -e
          docker exec -i collapsar-postgres psql -U collapsar -d collapsar -v ON_ERROR_STOP=1 -c "
          INSERT INTO report_categories (regiment_id, name, fields, is_recruit_promotion, min_rank_id)
          SELECT r.id, 'Курс молодого бойца', '[]', true, (SELECT id FROM ranks WHERE code = 'CPL')
          FROM regiments r
          WHERE r.name = '17-ый Передовой Полк'
            AND NOT EXISTS (
              SELECT 1 FROM report_categories rc
              WHERE rc.regiment_id = r.id AND rc.is_recruit_promotion = true
            );
          "
          docker exec -i collapsar-postgres psql -U collapsar -d collapsar -c "
          SELECT rc.id, rc.name, rc.regiment_id, rc.is_recruit_promotion, rc.min_rank_id
          FROM report_categories rc
          JOIN regiments r ON r.id = rc.regiment_id
          WHERE r.name = '17-ый Передовой Полк';
          "
