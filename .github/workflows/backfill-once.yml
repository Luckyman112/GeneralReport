name: Backfill (one-off, manual)

# Ручные one-off бэкфиллы, не завязанные на миграции (конвенция проекта —
# бэкфиллы отдельно от схемы). Все шаги идемпотентны, безопасно перезапускать.
# Запускать вручную через workflow_dispatch, удалить шаг/файл после успешного
# разового запуска.
on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: self-hosted
    steps:
      - name: Backfill base report categories for existing regiments
        run: |
          set -e
          docker exec -i collapsar-backend python -m scripts.backfill_base_categories
      - name: Insert "Курс молодого бойца" category for 17th Regiment
        run: |
          set -e
          docker exec -i collapsar-postgres psql -U collapsar -d collapsar -v ON_ERROR_STOP=1 -c "
          INSERT INTO report_categories (regiment_id, name, fields, is_recruit_promotion, min_rank_id)
          SELECT r.id, 'Курс молодого бойца', '[]', true, (SELECT id FROM ranks WHERE code = 'CPL')
          FROM regiments r
          WHERE r.name = '17-ый Передовой Полк'
            AND NOT EXISTS (
              SELECT 1 FROM report_categories rc
              WHERE rc.regiment_id = r.id AND rc.is_recruit_promotion = true
            );
          "
          docker exec -i collapsar-postgres psql -U collapsar -d collapsar -c "
          SELECT rc.id, rc.name, rc.regiment_id, rc.is_recruit_promotion, rc.min_rank_id
          FROM report_categories rc
          JOIN regiments r ON r.id = rc.regiment_id
          WHERE r.name = '17-ый Передовой Полк';
          "
      - name: Insert/convert "Наставничество" category into is_jedi_trial_report
        run: |
          set -e
          docker exec -i collapsar-postgres psql -U collapsar -d collapsar -v ON_ERROR_STOP=1 -c "
          INSERT INTO report_categories (regiment_id, name, fields, points, is_jedi_trial_report, commander_only)
          SELECT r.id, 'Наставничество', '[]', 10, true, true
          FROM regiments r
          WHERE r.is_jedi_order = true
          ON CONFLICT (regiment_id, name) DO UPDATE SET is_jedi_trial_report = true, commander_only = true;
          "
          docker exec -i collapsar-postgres psql -U collapsar -d collapsar -c "
          SELECT rc.id, rc.name, rc.regiment_id, rc.points, rc.is_jedi_trial_report, rc.commander_only
          FROM report_categories rc
          JOIN regiments r ON r.id = rc.regiment_id
          WHERE r.is_jedi_order = true;
          "
